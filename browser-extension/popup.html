<!DOCTYPE html>
<html>

<head>
    <title>Edge Policy AI</title>
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            padding: 16px;
            width: 320px;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
        }

        h3 {
            margin-top: 0;
            color: #c084fc;
            font-size: 18px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        p.subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin: 0 0 16px 0;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        .status-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #1e293b;
            padding: 10px;
            border-radius: 8px;
        }

        .status {
            padding: 4px 10px;
            border-radius: 20px;
            background: #065f46;
            color: #34d399;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .log-section h4 {
            font-size: 13px;
            color: #e2e8f0;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .log-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-item {
            background: #1e293b;
            padding: 10px;
            border-radius: 6px;
            border-left: 3px solid #ef4444;
            font-size: 12px;
        }

        .log-item .time {
            color: #64748b;
            font-size: 10px;
            margin-bottom: 4px;
        }

        .log-item .filename {
            font-weight: 600;
            color: #f8fafc;
            display: block;
            margin-bottom: 2px;
        }

        .log-item .reason {
            color: #fca5a5;
        }

        .no-logs {
            text-align: center;
            color: #475569;
            font-size: 12px;
            padding: 20px 0;
        }

        /* Scrollbar */
        .log-list::-webkit-scrollbar {
            width: 4px;
        }

        .log-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
    </style>
</head>

<body>
    <h3>🛡️ Edge Policy AI</h3>
    <p class="subtitle">Real-time Privacy Protection Active</p>

    <div class="status-container">
        <span>Protection Node</span>
        <div class="status">● Linked</div>
    </div>

    <div class="log-section">
        <h4>Recent Blocks</h4>
        <div id="logList" class="log-list">
            <div class="no-logs">No security events recorded.</div>
        </div>
    </div>

    <script>
        // Load logs from storage
        chrome.storage.local.get(['blockLogs'], (result) => {
            const logs = result.blockLogs || [];
            const container = document.getElementById('logList');

            if (logs.length > 0) {
                container.innerHTML = '';
                logs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'log-item';
                    const date = new Date(log.timestamp).toLocaleTimeString();
                    const shortUrl = log.url ? log.url.split('/')[2] : 'Unknown';
                    item.innerHTML = `
                        <div class="time">${date} • ${shortUrl}</div>
                        <span class="filename">${log.filename}</span>
                        <span class="reason">Blocked: Sensitive data detected</span>
                    `;
                    container.appendChild(item);
                });

                // Reset badge when popup is opened
                chrome.action.setBadgeText({ text: '' });
            }
        });
    </script>
</body>

</html>
