<!DOCTYPE html>
<html>

<head>
    <title>Edge Policy AI</title>
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-card: #1e293b;
            --primary: #c084fc;
            --primary-glow: rgba(168, 85, 247, 0.4);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #34d399;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            padding: 0;
            width: 380px;
            background-color: var(--bg-deep);
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
        }

        .header {
            padding: 20px;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, transparent 100%);
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        }

        .header h3 {
            margin: 0;
            color: var(--primary);
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-size: 11px;
            color: var(--text-muted);
            margin: 4px 0 0 0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 20px 20px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.05);
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .log-container {
            padding: 0 20px 20px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .log-header h4 {
            font-size: 12px;
            margin: 0;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .log-list {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .log-item {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.05);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .log-item.BLOCKED {
            border-left: 4px solid var(--danger);
        }

        .log-item.AUTHORIZED {
            border-left: 4px solid var(--success);
        }

        .log-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .log-filename {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .log-info {
            font-size: 11px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 800;
        }

        .BLOCKED .status-badge {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .AUTHORIZED .status-badge {
            background: rgba(52, 211, 153, 0.1);
            color: var(--success);
        }

        .no-logs {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* Scrollbar */
        .log-list::-webkit-scrollbar {
            width: 4px;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }

        .footer {
            padding: 12px 20px;
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid rgba(148, 163, 184, 0.1);
        }
    </style>
</head>

<body>
    <div class="header">
        <h3>🛡️ EDGE POLICY AI</h3>
        <p class="subtitle">Real-time Privacy Protection</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-value" id="blockedCount">0</span>
            <span class="stat-label">Blocked</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="allowedCount">0</span>
            <span class="stat-label">Authorized</span>
        </div>
    </div>

    <div class="log-container">
        <div class="log-header">
            <h4>Activity Feed</h4>
        </div>
        <div id="logList" class="log-list">
            <div class="no-logs">Monitoring active. Awaiting activity...</div>
        </div>
    </div>

    <div class="footer">
        Protective instance: Corporate Integrity 1.0
    </div>
    <script src="popup.js"></script>
</body>

</html>
