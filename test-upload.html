<!DOCTYPE html>
<html>

<head>
    <title>Edge Policy AI - Test Upload</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            color: #c084fc;
            margin-bottom: 24px;
        }

        input[type="file"] {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 6px;
            width: 100%;
            color: #94a3b8;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background: #6d28d9;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #10b981;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>External Data Upload</h1>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 24px;">Simulating an external web application.</p>
        <form id="testForm">
            <input type="file" id="fileInput" name="doc">
            <button type="submit">Finalize Upload</button>
        </form>
        <div id="status"></div>
    </div>
    <script>
        document.getElementById('testForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const file = document.getElementById('fileInput').files[0];
            if (!file) {
                document.getElementById('status').innerText = 'Please select a file first.';
                return;
            }
            document.getElementById('status').innerText = '✅ SUCCESS: File "' + file.name + '" uploaded to external server.';
            document.getElementById('status').style.color = '#10b981';
        });
    </script>
</body>

</html>
