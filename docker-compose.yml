# ============================================================
# Privacy-Preserving Document Processing System
# Edge AI Security Gateway — Docker Compose
# ============================================================

version: "3.9"

services:
  # ── Secure Document AI Application ──
  secure-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secure-doc-ai
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://secure_admin:${DB_PASSWORD:-change_me_in_production}@secure-db:5432/secure_doc_ai
    volumes:
      - ./backend/storage/uploads:/app/storage/uploads
      - ./backend/storage/processed:/app/storage/processed
      - ./backend/storage/signed:/app/storage/signed
      - ./backend/storage/keys:/app/storage/keys
      - ./backend/config/policies:/app/config/policies
    depends_on:
      secure-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - secure-network

  # ── PostgreSQL Database (Audit Trail) ──
  secure-db:
    image: postgres:16-alpine
    container_name: secure-doc-db
    environment:
      POSTGRES_DB: secure_doc_ai
      POSTGRES_USER: secure_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - secure-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secure_admin -d secure_doc_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - secure-network

volumes:
  secure-db-data:
    driver: local

networks:
  secure-network:
    driver: bridge
